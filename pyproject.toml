[project]
name = "civicsite"
version = "0.1.0"
description = "CivicSite Permit Copilot: cited, version-aware action queue over NYC DOB records (Elasticsearch + Mistral)"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9.0,<10",
  "mistralai>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "rich>=13",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
civicsite = "civicsite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicsite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
